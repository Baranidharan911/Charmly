# Push a tag like v1.0.1 and this builds Windows, Mac and Linux,
# then attaches the files to a GitHub Release. The website's download
# buttons always point at the newest release, so no site change is needed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/CharmLine-Setup.exe
            dist/CharmLine-Windows-Portable.zip
            dist/CharmLine-Mac.dmg
            dist/CharmLine-Linux.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CharmLine-Setup.exe
            dist/CharmLine-Windows-Portable.zip
            dist/CharmLine-Mac.dmg
            dist/CharmLine-Linux.AppImage
