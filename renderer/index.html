<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charm Line</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
@font-face{font-family:'Baloo Thambi 2';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/baloo-thambi-2-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo Thambi 2';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/baloo-thambi-2-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Oswald';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/oswald-latin-700-normal.woff2) format('woff2')}
/* The overlay only draws charms. Every control lives in the Studio window (studio.html). */
:root{
  box-sizing:border-box;
  --panel:rgba(24,22,20,.94);--ink:#f1e8d4;--line:rgba(241,232,212,.12);
  --on:#e1b45c;--on-ink:#1b1712;--accent:#ef6a61;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--panel:rgba(255,251,241,.94);--ink:#241f19;--line:rgba(36,31,25,.13);--on:#241f19;--on-ink:#fbf5e6;--accent:#b3262d}
}
:root[data-theme="light"]{--panel:rgba(255,251,241,.94);--ink:#241f19;--line:rgba(36,31,25,.13);--on:#241f19;--on-ink:#fbf5e6;--accent:#b3262d}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html,body{background:transparent!important}
body{
  color:var(--ink);
  font-family:"Baloo Thambi 2",ui-rounded,"Segoe UI",system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#c,#g{position:fixed;inset:0;display:block}
#c{touch-action:none;z-index:1}
#g{pointer-events:none;z-index:1}
#err{position:fixed;left:16px;bottom:16px;z-index:4;max-width:40ch;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
#err[hidden]{display:none}
#pill,#toast{position:fixed;left:0;top:0;z-index:2;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);white-space:nowrap;opacity:0;transition:opacity .16s ease;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#pill{display:flex;align-items:center;gap:7px;padding:5px 13px 5px 11px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 10px 26px -12px rgba(0,0,0,.6)}
#pill::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--on);flex:0 0 auto}
#pill.long::before{box-shadow:0 0 0 3px rgba(225,180,92,.35)}
#pill.done::before{content:'\2713';width:17px;height:17px;margin-left:-3px;font-size:11px;line-height:17px;text-align:center;color:var(--on-ink);font-weight:700}
#pill.on,#toast.on{opacity:1}
#toast{padding:5px 11px;border-radius:10px;font-size:13px;font-weight:500;max-width:min(46ch,calc(100vw - 32px));overflow:hidden;text-overflow:ellipsis}
#toast.bad{color:var(--accent)}
@media (prefers-reduced-motion:reduce){#pill,#toast{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Hanging charms. Drag a charm to swing it. Double-click one to open Charm Line."></canvas>
<canvas id="g" aria-hidden="true"></canvas>
<div id="pill" aria-hidden="true"><span></span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="err" hidden>3D rendering isn't available in this browser. Turn on hardware acceleration and reload.</div>

<script src="three.min.js"></script>
<script src="lib.js"></script>
<script src="gesture.js"></script>
<script src="app.js"></script>
</body>
</html>
