<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charm Line</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:">
<style>
@font-face{font-family:'Baloo Thambi 2';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/baloo-thambi-2-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo Thambi 2';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/baloo-thambi-2-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo Thambi 2';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/baloo-thambi-2-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo Thambi 2';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/baloo-thambi-2-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Oswald';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/oswald-latin-700-normal.woff2) format('woff2')}
#panel::-webkit-scrollbar{width:8px}#panel::-webkit-scrollbar-track{background:transparent}#panel::-webkit-scrollbar-thumb{background:rgba(241,232,212,.18);border-radius:8px}

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --wall-a:#1c1a17;--wall-b:#0e0d0c;--glow:rgba(214,160,72,.14);
  --bar:rgba(22,20,18,.7);--bar-ink:#efe6d1;
  --panel:rgba(24,22,20,.94);--ink:#f1e8d4;--muted:#a69c88;--line:rgba(241,232,212,.12);
  --chip:#26231f;--chip-hover:#312d28;--on:#e1b45c;--on-ink:#1b1712;
  --accent:#ef6a61;--focus:#7fd0f0;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --wall-a:#efe7d3;--wall-b:#d9cfb8;--glow:rgba(232,178,28,.2);
    --bar:rgba(255,251,240,.72);--bar-ink:#2a2620;
    --panel:rgba(255,251,241,.94);--ink:#241f19;--muted:#6d6456;--line:rgba(36,31,25,.13);
    --chip:#f0e7d2;--chip-hover:#e7dbc0;--on:#241f19;--on-ink:#fbf5e6;
    --accent:#b3262d;--focus:#1f6b8f;
  }
}
:root[data-theme="light"]{
  --wall-a:#efe7d3;--wall-b:#d9cfb8;--glow:rgba(232,178,28,.2);
  --bar:rgba(255,251,240,.72);--bar-ink:#2a2620;
  --panel:rgba(255,251,241,.94);--ink:#241f19;--muted:#6d6456;--line:rgba(36,31,25,.13);
  --chip:#f0e7d2;--chip-hover:#e7dbc0;--on:#241f19;--on-ink:#fbf5e6;
  --accent:#b3262d;--focus:#1f6b8f;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html,body{background:transparent!important}
body{
  color:var(--ink);
  font-family:"Baloo Thambi 2",ui-rounded,"Segoe UI",system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#c,#g{position:fixed;inset:0;display:block}
#c{touch-action:none;z-index:1}
#g{pointer-events:none;z-index:1}
#bar{
  position:fixed;top:0;left:0;right:0;z-index:2;padding-top:env(safe-area-inset-top,0px);pointer-events:none;
  background:var(--bar);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--line);color:var(--bar-ink);
}
#bar .in{height:30px;display:flex;align-items:center;gap:18px;padding:0 16px;font-size:14px}
#bar b{font-weight:700}
#bar .sp{flex:1}
#bar .dim{opacity:.7}
#hint{
  position:fixed;left:7vw;top:46%;z-index:0;pointer-events:none;max-width:14ch;
  font-size:clamp(34px,6vw,72px);line-height:.95;font-weight:600;letter-spacing:-.02em;opacity:.78;transition:opacity .8s ease;
}
#hint small{display:block;margin-top:18px;font-size:16px;line-height:1.35;font-weight:500;letter-spacing:0;max-width:30ch;color:var(--muted)}
#hint.gone{opacity:0}
#panel{
  position:fixed;z-index:3;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:326px;max-width:calc(100vw - 32px);max-height:calc(100% - 72px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 18px 50px -20px rgba(0,0,0,.6);padding:14px 16px 16px;font-size:15px;
}
#panel[hidden]{display:none}
#panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#panel header strong{font-size:19px;font-weight:700}
#panel h2{font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 8px}
.coll{margin-top:4px}
.coll summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px 6px;font-weight:600;font-size:15px;border-radius:8px}
.coll summary::-webkit-details-marker{display:none}
.coll summary span:last-child{font-weight:500;font-size:13px;color:var(--muted)}
.coll summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 8px}
.coll[open] summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.coll summary .t{flex:1}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:6px}
.chip{
  display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 4px 7px;border:0;border-radius:14px;
  background:var(--chip);color:var(--ink);font:inherit;font-size:12.5px;line-height:1.15;cursor:pointer;text-align:center;
}
.chip:hover{background:var(--chip-hover)}
.chip img{width:64px;height:82px;object-fit:contain}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;padding:6px 2px;border-radius:9px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--on);color:var(--on-ink);font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin-top:14px}
.row label{flex:0 0 auto;font-weight:500}
input[type=range]{flex:1;accent-color:var(--on);min-width:0}
.toggles{display:flex;gap:18px;margin-top:12px}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=checkbox]{accent-color:var(--on);width:16px;height:16px}
.btn{display:block;width:100%;margin-top:14px;padding:10px;border:0;border-radius:14px;font:inherit;font-weight:600;cursor:pointer;background:var(--on);color:var(--on-ink)}
.ghost{border:0;background:transparent;color:var(--muted);font:inherit;cursor:pointer;padding:4px 6px;border-radius:8px}
.ghost:hover{color:var(--ink)}
#sel{margin-top:16px;padding-top:4px;border-top:1px solid var(--line)}
#sel[hidden]{display:none}
#sel h2{color:var(--ink);font-size:16px}
.row input[type=text],.row input[type=number]{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.jseg{grid-template-columns:repeat(5,1fr);margin-top:12px}
.jseg button{font-size:12.5px;text-transform:capitalize}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.sw button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw button[aria-checked="true"]{border-color:var(--ink)}
#jed[hidden]{display:none}
.import{display:flex;align-items:center;justify-content:center;margin-top:10px;padding:9px;border-radius:14px;border:1.5px dashed var(--line);cursor:pointer;font-weight:600}
.import:hover{background:var(--chip)}
.import:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.note{margin:6px 2px 0;font-size:13px;color:var(--muted)}
.note:empty{display:none}
#capRow{cursor:pointer;gap:8px}
#imgOpts[hidden]{display:none}
.caps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.caps.fin{grid-template-columns:repeat(7,1fr);margin-top:8px}
.caps.fin button{padding:7px 0}
.caps.fin span{font-size:10.5px}
.caps.cd button{padding:8px 2px}
.caps[hidden],#capNote[hidden]{display:none}
.caps.cd button:first-child{grid-column:span 2}
.caps button{border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:12.5px;line-height:1.1;padding:7px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.caps button i{width:16px;height:16px;border-radius:50%;display:block;box-shadow:inset -2px -3px 5px rgba(0,0,0,.35),inset 2px 2px 4px rgba(255,255,255,.5)}
.caps button[aria-checked="true"]{background:var(--on);color:var(--on-ink);font-weight:600}
select{font:inherit;font-size:15px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);flex:1;min-width:0}
#jcustom[hidden],#ofinRow[hidden]{display:none}
.danger{background:transparent;color:var(--accent);border:1.5px solid currentColor}
#show{
  position:fixed;z-index:3;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;
  padding:9px 16px;border-radius:999px;cursor:pointer;box-shadow:0 10px 30px -14px rgba(0,0,0,.5);
}
#show[hidden]{display:none}
#err{position:fixed;left:16px;bottom:16px;z-index:4;max-width:40ch;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
#err[hidden]{display:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:640px){#hint{top:32%}#hint small{display:none}}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Hanging charms. Drag a charm to swing it."></canvas>
<canvas id="g" aria-hidden="true"></canvas>

<aside id="panel" aria-label="Charm controls">
  <header><strong>Charm Line</strong><button class="ghost" id="hide">Close</button></header>
  <p class="note" style="margin:0 2px 6px">Reopen anytime from the tray icon, or press Ctrl+Shift+H (⌘⇧H on Mac).</p>
  <div id="colls"></div>
  <label class="import"><input type="file" id="file" accept="image/png,image/webp,image/jpeg,image/svg+xml,.svg" hidden>Import an image (PNG or SVG)</label>
  <p class="note" id="imsg" role="status"></p>
  <h2>Bead cap</h2>
  <div class="caps cd" id="capd" role="radiogroup" aria-label="Bead cap design"></div>
  <div class="caps fin" id="caps" role="radiogroup" aria-label="Bead cap finish"></div>
  <p class="note" id="capNote">Each charm wears a cap made for it. Pick a design above to put the same cap on every charm.</p>
  <h2>Rope</h2>
  <div class="seg" role="radiogroup" aria-label="Rope style" id="ropes">
    <button role="radio" data-rope="thread">Golden thread</button>
    <button role="radio" data-rope="chain">Silver chain</button>
    <button role="radio" data-rope="neon">Neon</button>
  </div>
  <div class="row"><label for="size">Size</label><input type="range" id="size" min="0.6" max="1.6" step="0.05"></div>
  <div class="toggles">
    <label><input type="checkbox" id="sound"> Sound</label>
    <label><input type="checkbox" id="wind"> Mouse breeze</label>
  </div>
  <button class="btn" id="nudge">Nudge everything</button>
  <section id="sel" hidden>
    <h2 id="selName"></h2>
    <div class="row"><label for="len">Rope length</label><input type="range" id="len" min="60" max="420" step="5"></div>
    <div id="jed" hidden>
      <div class="row"><label for="jname">Name</label><input type="text" id="jname" maxlength="12" placeholder="On the back" autocomplete="off"></div>
      <div class="row"><label for="jnum">Number</label><input type="number" id="jnum" min="0" max="99"></div>
      <div class="row"><label for="jteam">Kit</label><select id="jteam"></select></div>
      <div id="jcustom">
        <div class="seg jseg" id="jstyle" role="radiogroup" aria-label="Pattern"></div>
        <div class="sw" id="jcolors" role="radiogroup" aria-label="Colors"></div>
      </div>
    </div>
    <div class="row"><label for="ocap">Cap</label><select id="ocap"></select></div>
    <div class="row" id="ofinRow"><label for="ofin">Finish</label><select id="ofin"></select></div>
    <div id="imgOpts" hidden><label class="row" id="capRow"><input type="checkbox" id="capOn"> Bead cap</label></div>
    <button class="btn danger" id="remove">Remove charm</button>
    <button class="ghost" id="forget" hidden style="margin-top:8px">Delete this image from the tray</button>
  </section>
</aside>
<button id="show" hidden>Controls</button>
<div id="err" hidden>3D rendering isn't available in this browser. Turn on hardware acceleration and reload.</div>

<script src="three.min.js"></script>
<script>
function createCharmLib(renderer){
const V3=THREE.Vector3,V2=THREE.Vector2,PI=Math.PI,TAU=PI*2;
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};

function envMap(){
  const es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.BoxGeometry(10,10,10),new THREE.MeshBasicMaterial({color:0x121010,side:THREE.BackSide})));
  const panel=(w,h,pos,rot,rgb)=>{const m=new THREE.MeshBasicMaterial({side:THREE.DoubleSide});m.color.setRGB(...rgb);const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);p.position.set(...pos);p.rotation.set(...rot);es.add(p)};
  panel(4.5,2.6,[-.6,4.8,1.2],[PI/2,0,0],[7,6.6,6]);
  panel(.5,6,[-4.8,.6,1.6],[0,PI/2,0],[6,5.8,5.4]);
  panel(.35,5.5,[4.8,.3,.6],[0,-PI/2,0],[5.2,3.4,1.8]);
  panel(9,9,[0,0,4.95],[0,PI,0],[.3,.28,.26]);
  panel(3,2,[-1.8,1.8,4.9],[0,PI,0],[3.2,3.1,2.9]);
  panel(.3,4,[1.6,.2,4.9],[0,PI,0],[2.6,2.6,2.6]);
  panel(1.2,1.2,[2.4,-1.6,4.9],[0,PI,0],[1.2,1.1,1]);
  panel(3,.3,[0,-2.8,4.8],[0,PI,0],[1.6,1.5,1.4]);
  panel(8,8,[0,-4.9,0],[-PI/2,0,0],[.08,.07,.06]);
  const pm=new THREE.PMREMGenerator(renderer);const t=pm.fromScene(es,.02).texture;pm.dispose();return t;
}
const env=envMap();
const ANISO=renderer.capabilities.getMaxAnisotropy();

function canvasTex(w,h,paint,srgb,wrap){
  const c=document.createElement('canvas');c.width=w;c.height=h;paint(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;
  if(wrap){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t;
}
const noiseTex=canvasTex(256,256,(x,w,h)=>{const d=x.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){const v=120+rnd()*135;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);x.globalAlpha=.5;for(let i=0;i<500;i++){x.fillStyle=rnd()<.5?'#000':'#fff';x.beginPath();x.arc(rnd()*w,rnd()*h,1+rnd()*2.2,0,7);x.fill()}},false,true);
const furTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#808080';x.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const a=rnd()*TAU,l=3+rnd()*7,px=rnd()*w,py=rnd()*h;x.strokeStyle=rnd()<.5?'rgba(0,0,0,.45)':'rgba(255,255,255,.45)';x.lineWidth=1;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}},false,true);
const grainTex=(base,dark,n=70,w=512,h=256)=>canvasTex(w,h,(x)=>{x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<n;i++){x.strokeStyle=dark.replace('A',(.15+rnd()*.35).toFixed(2));x.lineWidth=.6+rnd()*2.4;const y=rnd()*h;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(w*.3,y+rnd()*10-5,w*.7,y+rnd()*10-5,w,y+rnd()*6-3);x.stroke()}},true,true);
const woodTex=grainTex('#7a3f22','rgba(45,20,8,A)');
const willowTex=grainTex('#e2c48e','rgba(150,110,60,A)',90);
const wrapTex=canvasTex(512,64,(x,w,h)=>{x.fillStyle='#6b3f22';x.fillRect(0,0,w,h);for(let i=-10;i<w/8+10;i++){x.fillStyle=i%2?'#85532f':'#5a331b';x.beginPath();x.moveTo(i*8,0);x.lineTo(i*8+8,0);x.lineTo(i*8+8-24,h);x.lineTo(i*8-24,h);x.fill()}},true,true);wrapTex.repeat.set(6,1);
const ribTex=canvasTex(64,256,(x,w,h)=>{for(let y=0;y<h;y+=8){x.fillStyle='#fff';x.fillRect(0,y,w,4);x.fillStyle='#000';x.fillRect(0,y+4,w,4)}},false,true);

const smudgeTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='rgb(215,215,215)';x.fillRect(0,0,w,h);for(let i=0;i<90;i++){const v=150+rnd()*105|0;x.fillStyle=`rgba(${v},${v},${v},.55)`;x.beginPath();x.ellipse(rnd()*w,rnd()*h,10+rnd()*60,6+rnd()*30,rnd()*3,0,7);x.fill()}{const c2=document.createElement('canvas');c2.width=w;c2.height=h;const y2=c2.getContext('2d');y2.filter='blur(14px)';y2.drawImage(x.canvas,0,0);x.clearRect(0,0,w,h);x.drawImage(c2,0,0)}for(let i=0;i<260;i++){x.strokeStyle=`rgba(${rnd()<.5?120:255},${rnd()<.5?120:255},${rnd()<.5?120:255},.15)`;x.lineWidth=.6;const a=rnd()*w,b=rnd()*h,l=10+rnd()*50,t=rnd()*3;x.beginPath();x.moveTo(a,b);x.lineTo(a+Math.cos(t)*l,b+Math.sin(t)*l);x.stroke()}},false,true);
const knitTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#808080';x.fillRect(0,0,w,h);for(let yy=0;yy<h;yy+=4)for(let xx=0;xx<w;xx+=4){x.fillStyle=((xx+yy)/4)%2?'#9a9a9a':'#5e5e5e';x.beginPath();x.arc(xx+2,yy+2,1.5,0,7);x.fill()}},false,true);knitTex.repeat.set(14,14);
function mat(o,phys){const m=phys?new THREE.MeshPhysicalMaterial(o):new THREE.MeshStandardMaterial(o);if(m.color)m.color.convertSRGBToLinear();if(m.emissive)m.emissive.convertSRGBToLinear();if(m.sheen&&m.sheen.isColor)m.sheen.convertSRGBToLinear();return m}
const P=(c,o={})=>mat(Object.assign({color:c,roughness:.3,clearcoat:.8,clearcoatRoughness:.2},o),true);
const Mt=(c,r=.28,o={})=>mat(Object.assign({color:c,metalness:1,roughness:Math.min(1,r*1.2),roughnessMap:smudgeTex,envMapIntensity:1.25},o));
const M={
  gold:Mt(0xe0ae55,.24),goldSoft:Mt(0xc99640,.38),goldDark:Mt(0x9c7028,.4),
  brass:Mt(0xd3a048,.3,{side:THREE.DoubleSide}),brassDark:Mt(0x8a6224,.45),
  silver:Mt(0xdde2e8,.2),steel:Mt(0x9aa0a8,.34),bronze:Mt(0xa8743c,.4),
  wood:mat({map:woodTex,roughness:.55}),woodBand:mat({color:0x3d1d0e,roughness:.7}),
  black:mat({color:0x121010,roughness:.55}),ink:P(0x0c0b0b,{roughness:.35}),
  curl:mat({color:0x0d0b0b,roughness:.6,bumpMap:noiseTex,bumpScale:.05}),
  ivory:P(0xf2e6c8,{roughness:.32,clearcoat:.7}),
  red:P(0xc4200f,{roughness:.36,clearcoat:.9,clearcoatRoughness:.18}),
  redDeep:P(0x5a0a06,{roughness:.5,clearcoat:0}),tongue:P(0xd8364a),
  eyeWhite:P(0xfbf6ea,{roughness:.2,clearcoat:1}),iris:P(0xe06a18,{roughness:.25,clearcoat:1}),
  paint:P(0xfaf6ee,{roughness:.4,clearcoat:.3}),kumkum:P(0xc01020,{roughness:.35,clearcoat:.6}),
  glassBlue:P(0x0a2aa0,{roughness:.08,clearcoat:1,clearcoatRoughness:.04,reflectivity:.5}),
  glassWhite:P(0xf6f8ff,{roughness:.06,clearcoat:1,clearcoatRoughness:.03}),
  glassSky:P(0x58b4ee,{roughness:.05,clearcoat:1,clearcoatRoughness:.03}),glassInk:P(0x05070c,{roughness:.04,clearcoat:1}),

const IDB={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('charmline',2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('images'))r.result.createObjectStore('images')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async put(k,v){try{const d=await this.open();await new Promise(r=>{const t=d.transaction('images','readwrite');t.objectStore('images').put(v,k);t.oncomplete=t.onerror=r})}catch(e){}},
  async all(){try{const d=await this.open();return await new Promise(res=>{const out={},q=d.transaction('images','readonly').objectStore('images').openCursor();q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};q.onerror=()=>res(out)})}catch(e){return{}}},
  async del(k){try{const d=await this.open();d.transaction('images','readwrite').objectStore('images').delete(k)}catch(e){}}

function loadImport(key,url,name){
  return new Promise(res=>{const img=new Image();img.onload=()=>{const t=new THREE.Texture(img);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.minFilter=THREE.LinearMipmapLinearFilter;t.generateMipmaps=true;t.needsUpdate=true;imports[key]={url,name,img,tex:t};res(true)};img.onerror=()=>res(false);img.src=url});
}
const readAs=(f,how)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r[how](f)});
async function fileToImage(f){
  let url;
  if(/svg/i.test(f.type)||/\.svg$/i.test(f.name)){
    const txt=await readAs(f,'readAsText');const doc=new DOMParser().parseFromString(txt,'image/svg+xml'),el=doc.documentElement;
    if(!el||el.nodeName.toLowerCase()!=='svg')throw new Error('That SVG file could not be read.');
    const vb=(el.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
    let w=parseFloat(el.getAttribute('width')),h=parseFloat(el.getAttribute('height'));
    if(!(w>0&&h>0)||/%/.test(el.getAttribute('width')||'')){if(vb.length===4&&vb[2]>0&&vb[3]>0){w=vb[2];h=vb[3]}else{w=h=512}}
    const k=1024/Math.max(w,h);el.setAttribute('width',Math.round(w*k));el.setAttribute('height',Math.round(h*k));
    const out=new XMLSerializer().serializeToString(el);url='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(out)));
  }else url=await readAs(f,'readAsDataURL');
  return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('That image could not be opened.'));i.src=url});
}
function processImage(img){
  const max=1024,s=Math.min(max/Math.max(img.naturalWidth,img.naturalHeight),2);
  const w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  let d;try{d=x.getImageData(0,0,w,h)}catch(e){return c.toDataURL('image/png')}
  const px=d.data,corners=[0,w-1,(h-1)*w,h*w-1];
  if(corners.every(i=>px[i*4+3]>250)){
    const avg=[0,1,2].map(ch=>corners.reduce((a,i)=>a+px[i*4+ch],0)/4);
    const spread=Math.max(...corners.map(i=>Math.hypot(px[i*4]-avg[0],px[i*4+1]-avg[1],px[i*4+2]-avg[2])));
    if(spread<60){
      const tol=42,seen=new Uint8Array(w*h),st=[];
      for(let i=0;i<w;i++)st.push(i,(h-1)*w+i);for(let j=0;j<h;j++)st.push(j*w,j*w+w-1);
      while(st.length){const i=st.pop();if(seen[i])continue;seen[i]=1;const o=i*4,dist=Math.hypot(px[o]-avg[0],px[o+1]-avg[1],px[o+2]-avg[2]);if(dist>tol)continue;
        px[o+3]=dist>tol*.6?Math.round(255*(dist-tol*.6)/(tol*.4)):0;const xx=i%w,yy=(i/w)|0;
        if(xx>0)st.push(i-1);if(xx<w-1)st.push(i+1);if(yy>0)st.push(i-w);if(yy<h-1)st.push(i+w)}
      x.putImageData(d,0,0);
    }
  }
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)if(px[(yy*w+xx)*4+3]>12){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}
  if(x1<0)return null;
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}
$('file').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;e.target.value='';const msg=$('imsg');
  if(f.size>25*1024*1024){msg.textContent='That file is over 25 MB. Use a smaller image.';return}
  msg.textContent='Loading image…';
  try{
    const img=await fileToImage(f);const url=processImage(img);
    if(!url){msg.textContent='That image is fully transparent, so there is nothing to hang.';return}
    const k='img'+Date.now(),name=f.name.replace(/\.[^.]+$/,'').slice(0,18)||'Your image';
    if(!await loadImport(k,url,name)){msg.textContent='That image could not be opened.';return}
    IDB.put(k,{url,name});msg.textContent='';buildTray();addCharm('img',{key:k,cap:true});
  }catch(er){msg.textContent=er&&er.message?er.message:'That image could not be opened.'}
});

function renderThumbs(k=1){
  const tw=128*k,th=164*k,ts=new THREE.Scene();ts.environment=LIB.env;LIB.lights(ts);
  renderer.setPixelRatio(1);renderer.setSize(tw,th,false);
  const out={};
  for(const id of Object.keys(LIB.TYPES)){
    const b=LIB.build(id);b.g.rotation.y=-.35;ts.add(b.g);
    const hh=Math.max(b.height+.15,(b.width+.25)*th/tw),cam=new THREE.OrthographicCamera(-hh*tw/th/2,hh*tw/th/2,.08,-hh+.08,-50,50);cam.position.z=10;
    renderer.setClearColor(0,0);renderer.clear();renderer.render(ts,cam);
    out[id]=glc.toDataURL('image/png');ts.remove(b.g);LIB.dispose(b.g);
  }
  return out;
}
let THUMBS={};

function save(){if(DEMO)return;clearTimeout(save.t);save.t=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({S,charms:charms.map(c=>({type:c.type,axf:c.axf,len:c.len,opts:c.opts}))}))}catch(e){}},300)}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);glc.style.width=W+'px';glc.style.height=H+'px';
  camera.left=0;camera.right=W;camera.top=0;camera.bottom=-H;camera.updateProjectionMatrix();
  {const D=3000,sc=LT.key.shadow.camera,m=Math.max(W,H)*.75;LT.key.target.position.set(W/2,-H/2,0);LT.key.position.set(W/2+KEY_DIR.x*D,-H/2+KEY_DIR.y*D,KEY_DIR.z*D);sc.left=-m;sc.right=m;sc.top=m;sc.bottom=-m;sc.near=10;sc.far=D*2;sc.updateProjectionMatrix();LT.key.target.updateMatrixWorld()}

  wake();
}
const CL=window.charmline||null;let TOPINSET=+(new URLSearchParams(location.search).get('top')||0),passOver=null;const lastPt={x:-1,y:-1};
function overAt(x,y){if(drag)return true;const p=$('panel');if(!p.hidden){const r=p.getBoundingClientRect();if(x>=r.left-4&&x<=r.right+4&&y>=r.top-4&&y<=r.bottom+4)return true}return !!(hitHook(x,y)||hitCharm(x,y))}
function pass(x,y){lastPt.x=x;lastPt.y=y;if(!CL)return;const o=overAt(x,y);if(o!==passOver){passOver=o;CL.setIgnore(!o)}}
window.addEventListener('pointermove',e=>pass(e.clientX,e.clientY),true);

  addEventListener('message',e=>{

async function init(){

(document.fonts?Promise.race([Promise.all([document.fonts.ready,document.fonts.load('700 100px Oswald')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve()).then(init,init);
